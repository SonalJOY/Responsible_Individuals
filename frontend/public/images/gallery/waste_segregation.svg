<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wasteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#wasteBg)" />

  <!-- Clean Residential Street Ground -->
  <path d="M 0 320 L 800 320 L 800 500 L 0 500 Z" fill="#1E293B" />
  <line x1="0" y1="320" x2="800" y2="320" stroke="#FBBF24" stroke-width="4" />

  <!-- Color-coded Waste Segregation Bins -->
  <!-- Wet Waste (Green) -->
  <rect x="180" y="240" width="80" height="120" rx="10" fill="#166534" />
  <rect x="175" y="230" width="90" height="15" rx="5" fill="#22C55E" />
  <text x="200" y="300" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">WET</text>

  <!-- Dry Waste (Blue) -->
  <rect x="300" y="240" width="80" height="120" rx="10" fill="#1E40AF" />
  <rect x="295" y="230" width="90" height="15" rx="5" fill="#3B82F6" />
  <text x="320" y="300" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">DRY</text>

  <!-- Hazardous (Red) -->
  <rect x="420" y="240" width="80" height="120" rx="10" fill="#991B1B" />
  <rect x="415" y="230" width="90" height="15" rx="5" fill="#EF4444" />
  <text x="435" y="300" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">HAZARD</text>

  <!-- Community Volunteer Silhouettes -->
  <g fill="#F8FAFC">
    <circle cx="580" cy="200" r="16" />
    <path d="M 560 225 C 560 225, 580 220, 600 225 L 605 310 L 555 310 Z" />

    <!-- Sorting action -->
    <path d="M 560 235 Q 490 230, 440 240" stroke="#F8FAFC" stroke-width="5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="270" height="42" rx="21" fill="rgba(15, 23, 42, 0.65)" />
  <text x="50" y="56" fill="#FDE047" font-family="sans-serif" font-size="14" font-weight="bold">ZERO WASTE SEGREGATION</text>
</svg>
