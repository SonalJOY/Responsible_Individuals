<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ecoBg)" />

  <!-- River / Water Ecosystem -->
  <path d="M 0 250 Q 250 200, 500 280 T 800 240 L 800 500 L 0 500 Z" fill="#042F2C" opacity="0.8" />
  <path d="M 0 300 Q 300 260, 550 340 T 800 310 L 800 500 L 0 500 Z" fill="#0F766E" />

  <!-- Water Sample Test Tubes & Scientific Icons -->
  <g fill="#99F6E4" stroke="#99F6E4">
    <!-- Test Tube 1 -->
    <rect x="550" y="150" width="24" height="120" rx="12" fill="none" stroke-width="4" />
    <rect x="554" y="200" width="16" height="64" rx="8" fill="#2DD4BF" opacity="0.8" />

    <!-- Test Tube 2 -->
    <rect x="600" y="120" width="24" height="120" rx="12" fill="none" stroke-width="4" />
    <rect x="604" y="160" width="16" height="74" rx="8" fill="#38BDF8" opacity="0.8" />
  </g>

  <!-- Citizen Science Volunteers -->
  <g fill="#F8FAFC">
    <circle cx="280" cy="220" r="16" />
    <path d="M 260 245 C 260 245, 280 240, 300 245 L 305 330 L 255 330 Z" />

    <!-- Arm taking water sample -->
    <path d="M 300 255 Q 340 270, 370 290" stroke="#F8FAFC" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="375" cy="295" r="10" fill="#38BDF8" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="260" height="42" rx="21" fill="rgba(15, 23, 42, 0.65)" />
  <text x="50" y="56" fill="#2DD4BF" font-family="sans-serif" font-size="14" font-weight="bold">WATER QUALITY MONITORING</text>
</svg>
