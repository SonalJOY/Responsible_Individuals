<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="artisanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#artisanBg)" />

  <!-- Warm Workshop Sunlight -->
  <circle cx="700" cy="100" r="140" fill="#FDE047" opacity="0.2" />

  <!-- Loom Frame Threads -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="2">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="140" y1="0" x2="140" y2="500" />
    <line x1="180" y1="0" x2="180" y2="500" />
    <line x1="220" y1="0" x2="220" y2="500" stroke="#F472B6" stroke-width="4" />
    <line x1="260" y1="0" x2="260" y2="500" stroke="#FBBF24" stroke-width="4" />
    <line x1="300" y1="0" x2="300" y2="500" stroke="#34D399" stroke-width="4" />
    <line x1="340" y1="0" x2="340" y2="500" />
    <line x1="380" y1="0" x2="380" y2="500" />
  </g>

  <!-- Woven Fabric Texture -->
  <rect x="80" y="220" width="320" height="280" fill="#A78BFA" opacity="0.4" />
  <rect x="80" y="240" width="320" height="40" fill="#F472B6" opacity="0.6" />
  <rect x="80" y="320" width="320" height="30" fill="#FBBF24" opacity="0.6" />

  <!-- Artisan Woman Silhouettes -->
  <g fill="#F8FAFC">
    <circle cx="500" cy="220" r="18" />
    <!-- Bindi / Hair detail -->
    <path d="M 480 245 C 480 245, 500 240, 520 245 L 530 360 L 470 360 Z" fill="#DDD6FE" />

    <!-- Hands on Loom Shuttle -->
    <path d="M 470 270 Q 420 260, 380 275" stroke="#F8FAFC" stroke-width="6" fill="none" stroke-linecap="round" />
    <rect x="360" y="265" width="30" height="15" rx="5" fill="#FBBF24" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="250" height="42" rx="21" fill="rgba(15, 23, 42, 0.65)" />
  <text x="50" y="56" fill="#C4B5FD" font-family="sans-serif" font-size="14" font-weight="bold">WOMEN ARTISAN WEAVING</text>
</svg>
