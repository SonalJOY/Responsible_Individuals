<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="forestSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#forestSky)" />

  <!-- Sun rays through trees -->
  <polygon points="400,0 200,500 300,500" fill="#FDE047" opacity="0.12" />
  <polygon points="400,0 500,500 650,500" fill="#FDE047" opacity="0.15" />

  <!-- Soil Ground -->
  <path d="M 0 350 Q 400 320, 800 350 L 800 500 L 0 500 Z" fill="url(#soilGrad)" />

  <!-- Miyawaki Trees Dense Forest -->
  <g fill="#10B981">
    <circle cx="150" cy="220" r="80" opacity="0.85" />
    <circle cx="280" cy="180" r="95" fill="#047857" />
    <circle cx="450" cy="200" r="85" fill="#059669" />
    <circle cx="620" cy="230" r="75" opacity="0.9" />
  </g>
  <g fill="#34D399">
    <circle cx="100" cy="280" r="60" />
    <circle cx="220" cy="250" r="65" />
    <circle cx="360" cy="240" r="70" />
    <circle cx="530" cy="260" r="60" />
    <circle cx="680" cy="270" r="65" />
  </g>

  <!-- Tree Trunks -->
  <path d="M 270 270 L 290 270 L 285 360 L 275 360 Z" fill="#78350F" />
  <path d="M 440 280 L 460 280 L 455 360 L 445 360 Z" fill="#451A03" />

  <!-- Volunteers planting Miyawaki Saplings -->
  <g fill="#F8FAFC">
    <!-- Volunteer 1 -->
    <circle cx="330" cy="330" r="12" />
    <path d="M 315 350 C 315 350, 330 345, 345 350 L 350 410 L 310 410 Z" />

    <!-- Sapling in soil -->
    <path d="M 390 380 L 390 340" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <circle cx="380" cy="335" r="8" fill="#34D399" />
    <circle cx="400" cy="338" r="7" fill="#10B981" />
  </g>

  <!-- Badge -->
  <rect x="30" y="30" width="240" height="42" rx="21" fill="rgba(15, 23, 42, 0.65)" />
  <text x="50" y="56" fill="#6EE7B7" font-family="sans-serif" font-size="14" font-weight="bold">URBAN MIYAWAKI FOREST</text>
</svg>
